[project]
name = "nonebot-plugin-redbag-notice"
version = "0.3.1"
description = "QQ 红包私聊提醒插件：超级用户私聊配置监听群，群内出现红包时私聊通知提醒名单"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "TonyLiangP2010405", email = "" },
]
keywords = ["nonebot", "nonebot2", "plugin", "qq", "redbag", "redpacket", "napcat", "notice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "nonebot2>=2.2.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-localstore>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "nonebot2[fastapi]>=2.2.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "nonebug>=0.3",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/TonyLiangP2010405/nonebot-plugin-redbag-notice"
Repository = "https://github.com/TonyLiangP2010405/nonebot-plugin-redbag-notice"

[tool.nonebot]
plugins = ["nonebot_plugin_redbag_notice"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_redbag_notice"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
